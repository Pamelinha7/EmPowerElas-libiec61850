# Copiar para /etc/systemd/system/empelas-<mu|ctrl|prot>.service.d/relogio.conf
# Espera ate 30 s o chrony acertar o relogio antes de ligar o programa.
# Se nao acertar nesse tempo, liga mesmo assim (o "-" ignora a falha).
[Unit]
After=chrony.service

[Service]
ExecStartPre=-/usr/bin/chronyc waitsync 6 1 0 5
